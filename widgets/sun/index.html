<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Weather Widget</title>
    <link rel="stylesheet" href="./styles.css?v=92" />
  </head>
  <body>
    <main class="stage" aria-label="Figma weather widget">
      <section class="widget" data-node-id="36:4" aria-label="Weather forecast">
        <div class="widget-design">
          <div class="rain-flow" aria-hidden="true">
            <video class="rain-video is-visible" src="./assets/rain-drops.mp4?v=90" autoplay muted playsinline preload="auto"></video>
            <video class="rain-video" src="./assets/rain-drops.mp4?v=90" muted playsinline preload="auto"></video>
          </div>

          <div class="progressive-edge-blur" aria-hidden="true"></div>

          <div class="content" data-node-id="196:145">
            <div class="weather-main">
              <div class="location" data-node-id="196:158">
                <span data-node-id="196:159">Moscow</span>
                <span class="location-icon" data-node-id="196:160">
                  <img src="./assets/noun-gps-5981327.svg" alt="" />
                </span>
              </div>

              <div class="temp-frame" data-node-id="196:161">
                <div class="current-temp" data-node-id="196:162">
                  <div class="temp-content" data-node-id="196:163">
                    <span class="temp-value" data-node-id="196:164">32</span>
                    <span class="temp-degree" data-node-id="196:165">°</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="weather-details" data-node-id="196:148">
              <img class="rain-icon" data-node-id="196:150" src="./assets/sun.svg" alt="" />
              <div class="detail-lines" data-node-id="196:152">
                <span data-node-id="196:153">Sunny</span>
                <span data-node-id="196:154">H:36°</span>
                <span data-node-id="196:155">L:19°</span>
                <span data-node-id="196:156">UV:6</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./seamless-loop.js?v=90"></script>
  </body>
</html>
